<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%230e6b61%22/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #fbfaf7; --ink: #1d1c19; --ink-2: #3a3833; --muted: #706c63; --faint: #a19d93;
  --line: #e5e2d9; --line-2: #efede6; --accent: #0e6b61; --accent-soft: #e2f1ee;
  --add-bg: #e7f5ea; --add-ink: #18753a; --add-gutter: #cdebd5; --del-bg: #fcebea; --del-ink: #b3261e; --del-gutter: #f6d2cf;
  --high: #c9302c; --high-soft: #fbe9e8; --med: #b26b00; --med-soft: #fbf1df; --low: #87837a; --low-soft: #efede7;
  --get: #2563c9; --post: #18753a; --put: #a05a00; --delete: #b3261e; --other: #6b5bb8;
  --shadow: 0 1px 0 rgba(29,28,25,.04), 0 1px 3px rgba(29,28,25,.06);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131312; --panel: #1b1b19; --panel-2: #181816; --ink: #ecebe5; --ink-2: #d2d0c8; --muted: #9c988e; --faint: #6e6b63;
    --line: #2d2c28; --line-2: #24231f; --accent: #4cc7b6; --accent-soft: #15302c;
    --add-bg: rgba(46,160,67,.14); --add-ink: #6fd08b; --add-gutter: rgba(46,160,67,.22); --del-bg: rgba(248,81,73,.13); --del-ink: #ff8a80; --del-gutter: rgba(248,81,73,.22);
    --high: #ff6b63; --high-soft: rgba(255,107,99,.12); --med: #f0b54a; --med-soft: rgba(240,181,74,.12); --low: #9c988e; --low-soft: rgba(156,152,142,.12);
    --get: #6aa4ff; --post: #6fd08b; --put: #f0b54a; --delete: #ff8a80; --other: #b3a5ff;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--line-2); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 14px; padding: 10px 20px; max-width: none; margin: 0 auto; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -.02em; font-size: 16px; display: flex; align-items: center; gap: 7px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 3px var(--accent-soft); }
.ref { font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46ch; }
.ref.sw { display: flex; align-items: center; gap: 1ch; max-width: 78ch; min-width: 0; }
.ref.sw > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
.ref.sw > b { flex-shrink: 3; }
.ref.sw > .refbtn { flex-shrink: 0; max-width: 52ch; }
.ref b { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.refbtn { font: 600 12.5px var(--mono); color: var(--ink); background: none; border: 1px solid transparent; border-radius: 6px; padding: 1px 5px; margin: 0 -1px; cursor: pointer; }
.refbtn:hover, .refbtn[aria-expanded="true"] { border-color: var(--line); background: var(--panel); }
.refbtn .car { color: var(--faint); font-weight: 400; margin-left: 3px; }
.switching { color: var(--accent); font-size: 12px; white-space: nowrap; }
.switcher { position: fixed; top: 52px; left: 20px; z-index: 40; width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 620px); display: none; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); overflow: hidden; }
.switcher.open { display: flex; }
.switcher .sw-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); font-size: 12.5px; color: var(--muted); }
.switcher input { font: 12.5px var(--mono); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; }
.switcher input:focus { border-color: var(--accent); }
.switcher .sw-base { width: 15ch; }
.switcher .sw-q { flex: 1; min-width: 0; }
.switcher ul { list-style: none; margin: 0; padding: 4px; overflow-y: auto; }
.switcher li { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
.switcher li.sel { background: var(--accent-soft); }
.switcher li .nm { font: 12.5px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher li .nm em { font: 11px var(--sans); font-style: normal; color: var(--faint); margin-left: 6px; }
.switcher li.cur .nm::after { content: "current"; font: 600 10.5px var(--sans); color: var(--accent); margin-left: 8px; }
.switcher li .when { font-size: 11.5px; color: var(--faint); text-align: right; white-space: nowrap; }
.switcher li .sub { grid-column: 1 / -1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher .sw-empty { padding: 14px 12px; color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.h { color: var(--high); background: var(--high-soft); border-color: transparent; font-weight: 600; }
.pill.m { color: var(--med); background: var(--med-soft); border-color: transparent; font-weight: 600; }
.pill.l { color: var(--low); background: var(--low-soft); border-color: transparent; }
.add { color: var(--add-ink); } .del { color: var(--del-ink); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: default; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.meters { display: flex; align-items: center; gap: 14px; }
.meter { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); cursor: pointer; min-width: 74px; }
.meter:hover { color: var(--ink); }
.meter .t b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .bar { width: 74px; height: 4px; }
.meter.full .bar > span { background: var(--add-ink); }
.meter.full .t b { color: var(--add-ink); }
.merge { font-size: 12px; font-weight: 650; color: var(--add-ink); background: var(--add-bg); border-radius: 999px; padding: 3px 10px; }
.merge.not { color: var(--muted); background: var(--line-2); font-weight: 500; }
.bar { width: 90px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; max-width: none; margin: 0 auto; padding: 22px 20px 120px; }
nav.rail { position: sticky; top: 66px; align-self: start; max-height: calc(100vh - 80px); overflow: auto; font-size: 13px; }
.rail h6 { margin: 18px 0 6px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.rail a.sec { display: flex; justify-content: space-between; align-items: center; padding: 5px 9px; border-radius: 6px; text-decoration: none; color: var(--ink-2); }
.rail a.sec:hover, .rail a.sec.on { background: var(--panel); box-shadow: var(--shadow); color: var(--ink); }
.rail a.sec span.n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail a.sec span.n.hot { color: var(--high); font-weight: 600; }
.rail .file { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; padding: 4px 9px; border-radius: 6px; cursor: pointer; align-items: center; }
.rail .file:hover { background: var(--panel); }
.rail .file .rk { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
.rail .file .nm { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.rail .file.done .nm { color: var(--faint); text-decoration: line-through; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.dot.high { background: var(--high); } .dot.medium { background: var(--med); } .dot.low { background: var(--low); } .dot.none { background: var(--line); }

main { min-width: 0; }
section.sec { margin: 0 0 40px; scroll-margin-top: 76px; }
section.sec > h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; margin: 0 0 12px;
  display: flex; align-items: center; gap: 10px; }
section.sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.card + .card { margin-top: 10px; }
.grid2 > .card { margin-top: 0; }
.empty { color: var(--faint); font-size: 13px; padding: 4px 2px; }

/* ---------- topics, groups, back ---------- */
.rail a.topic { display: flex; justify-content: space-between; align-items: center; padding: 4px 9px; border-radius: 6px; text-decoration: none; color: var(--ink-2); cursor: pointer; }
.rail a.topic:hover { background: var(--panel); }
.rail a.topic.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.rail a.topic span.n { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail a.topic .dot { margin-left: 6px; }
section.sec > h2 { cursor: pointer; user-select: none; }
section.sec > h2 .chev, .tg-hd .chev { display: inline-block; transition: transform .15s; color: var(--faint); font-size: 10px; }
section.sec:not(.collapsed) > h2 .chev, .tgroup.open > .tg-hd .chev { transform: rotate(90deg); }
section.sec.collapsed > :not(h2) { display: none; }
section.sec > h2 .ctl { order: 3; display: flex; gap: 10px; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
section.sec > h2 .ctl button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; }
section.sec > h2 .ctl button:hover { text-decoration: underline; }
section.sec > h2 .fl { order: 1; color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; }
section.sec > h2::after { order: 2; }
.tgroup + .tgroup { margin-top: 8px; }
.tg-hd { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); padding: 9px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.tg-hd:hover { border-color: var(--faint); }
.tg-hd .cnt { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.tg-hd .spacer { flex: 1; }
.tg-hd .peek { color: var(--faint); font-weight: 400; font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tgroup:not(.open) > .tg-body { display: none; }
.tg-body { margin: 8px 0 18px; padding-left: 14px; border-left: 2px solid var(--accent-soft); }
.backbtn { position: fixed; right: 22px; bottom: 22px; z-index: 40; display: none; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); box-shadow: 0 4px 16px rgba(0,0,0,.12); cursor: pointer; font-size: 13px; color: var(--ink); }
.backbtn.on { display: inline-flex; }
.backbtn:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- triage ---------- */
.readfirst .spot { display: grid; grid-template-columns: 22px 26px minmax(0, 1fr) auto; gap: 8px 10px; padding: 12px 18px; border-top: 1px solid var(--line-2); align-items: start; scroll-margin-top: 90px; }
.readfirst .spot .n { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.readfirst .spot .why2 { font-size: 14px; color: var(--ink); }
.readfirst .spot > .diff { grid-column: 1 / -1; margin: 4px -18px -12px; }
.readfirst .spot.done:not(.peek) > .diff { display: none; }
.readfirst .spot.done:not(.peek) .why2 { opacity: .55; }
.readfirst .sub { padding: 0 18px 12px; color: var(--muted); font-size: 13px; }
.readreason { font-size: 12.5px; color: var(--accent); margin-top: 3px; }
.routine-bar { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 18px; border: 0; border-top: 1px solid var(--line-2); background: var(--panel-2); color: var(--muted); font-size: 13px; cursor: pointer; text-align: left; }
.routine-bar:hover { color: var(--ink); }
.routine-bar b { color: var(--add-ink); font-weight: 600; }
.routine-list:not(.open) { display: none; }
.chap-hd .cnts b { color: var(--ink); }

/* ---------- re-check ---------- */
.verdict { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.verdict.fixed { color: var(--add-ink); background: var(--add-bg); }
.verdict.still_present { color: var(--high); background: var(--high-soft); }
.verdict.partly_fixed, .verdict.stale { color: var(--med); background: var(--med-soft); }
.row.fixed .title { text-decoration: line-through; color: var(--muted); }
.recheck-note { font-size: 13px; color: var(--ink-2); margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--line); }
.resolved { padding: 10px 16px; margin-bottom: 10px; }
.resolved h4 { margin: 0 0 4px; font-size: 12px; color: var(--add-ink); letter-spacing: .04em; text-transform: uppercase; }
.resolved li { font-size: 13px; color: var(--muted); text-decoration: line-through; }

/* ---------- decisions ---------- */
.dec { padding: 0; scroll-margin-top: 90px; }
.dec .dhd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 13px 16px 11px; align-items: start; }
.dec .dtitle { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.dec .dmeta { display: flex; gap: 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.dec .vbtns { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.dec .vbtns button { border: 0; background: var(--panel); padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.dec .vbtns button + button { border-left: 1px solid var(--line); }
.dec .vbtns button:hover { color: var(--ink); background: var(--panel-2); }
.dec .vbtns button.on.agree { color: var(--add-ink); background: var(--add-bg); font-weight: 600; }
.dec .vbtns button.on.question { color: var(--med); background: var(--med-soft); font-weight: 600; }
.dec .vbtns button.on.disagree { color: var(--high); background: var(--high-soft); font-weight: 600; }
.dec .ba h5 { color: var(--muted); }
.dec .trade { padding: 10px 16px; font-size: 13.5px; color: var(--ink); border-top: 1px solid var(--line-2); background: var(--panel-2); }
.dec .trade h5 { margin: 0 0 3px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 650; }
.dec .dfoot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--line-2); }
.dec .dfoot .spacer { flex: 1; }
.dec .dnote { padding: 0 16px 12px; }
.dec .dnote textarea { width: 100%; min-height: 54px; font: 13.5px/1.5 var(--sans); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.dec .dnote textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.dec > .diff { border-top: 1px solid var(--line-2); }
.dec.agreed:not(.peek) > :not(.dhd), .dec.agreed:not(.peek) .dmeta { display: none; }
.dec.agreed:not(.peek) .dtitle { opacity: .55; font-size: 14px; }
.dec.agreed:not(.peek) .dhd { cursor: pointer; padding-top: 9px; padding-bottom: 9px; }
.dec-intro { color: var(--muted); font-size: 13px; margin: -4px 2px 12px; max-width: 80ch; }

/* ---------- map ---------- */
.mapbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.mapbar .lbl { font-size: 12px; color: var(--muted); margin-right: 4px; }
.mapbar .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.map { position: relative; display: grid; gap: 34px; padding: 14px 16px 18px; overflow: hidden; }
.map svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.mcol { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mcol .mch { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.mcol .mcb { font-size: 11.5px; color: var(--faint); margin-top: -8px; }
.mnode { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 7px 10px 8px; cursor: pointer;
  box-shadow: var(--shadow); transition: opacity .15s, border-color .15s, box-shadow .15s; position: relative; }
.mnode.added { border-left-color: var(--add-ink); } .mnode.modified { border-left-color: var(--med); } .mnode.removed { border-left-color: var(--del-ink); }
.mnode:hover { border-color: var(--faint); }
.mnode.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.map.focus .mnode:not(.on) { opacity: .28; }
.mnode .mk { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 6px; align-items: center; }
.mnode .mk .stx { font-weight: 700; }
.mnode.added .mk .stx { color: var(--add-ink); } .mnode.modified .mk .stx { color: var(--med); } .mnode.removed .mk .stx { color: var(--del-ink); }
.mnode .mn { font-family: var(--mono); font-size: 12.5px; color: var(--ink); font-weight: 600; word-break: break-word; }
.mnode.removed .mn { text-decoration: line-through; color: var(--muted); }
.mnode .mf { margin: 5px 0 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.mnode .mf li { display: flex; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnode .mf li .s { width: 9px; flex: none; font-weight: 700; }
.mnode .mf li.added { color: var(--add-ink); } .mnode .mf li.removed { color: var(--del-ink); text-decoration: line-through; } .mnode .mf li.changed, .mnode .mf li.renamed { color: var(--med); }
.mnode .mf li .ty { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.mnode .md { font-size: 11.5px; color: var(--faint); margin-top: 3px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mnode .fb { position: absolute; top: -8px; right: -8px; display: flex; gap: 3px; }
.mnode .fb span { background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-content: center; padding: 0 5px; }
.edges path { fill: none; stroke: var(--line); stroke-width: 1.4; transition: opacity .15s; }
.edges path.writes { stroke: color-mix(in srgb, var(--med) 55%, transparent); }
.edges path.reads { stroke: color-mix(in srgb, var(--get) 45%, transparent); }
.edges path.alters { stroke: color-mix(in srgb, var(--other) 55%, transparent); }
.edges path.calls, .edges path.enqueues { stroke: color-mix(in srgb, var(--muted) 45%, transparent); }
.edges path.uses, .edges path.contains, .edges path.references { stroke: color-mix(in srgb, var(--faint) 55%, transparent); stroke-dasharray: 4 3; }
.edges path.weak:not(.on) { display: none; }      /* "uses a shape" lines only when you're looking at them */
.edges path.flow { stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: none; }
.map.focus .edges path:not(.on) { opacity: .12; }
.map.focus .edges path.on { stroke-width: 2.2; }
.edges text { font: 600 10.5px var(--sans); fill: var(--ink-2); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.mlegend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px; border-top: 1px solid var(--line-2); font-size: 11.5px; color: var(--muted); }
.mlegend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }

/* ---------- comprehension ---------- */

.intent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }

.card.ent.done:not(.peek) .hd, .card.bl.done:not(.peek) { cursor: pointer; }
.tg-hd .rv { font-weight: 500; font-size: 12px; color: var(--muted); }
.tg-hd .rv.all { color: var(--add-ink); }
.row .title { font-weight: 560; color: var(--ink); }
.row .detail { color: var(--ink-2); font-size: 13px; margin-top: 2px; white-space: pre-line; }
.loc { font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38ch; direction: rtl; text-align: right; }

/* ---------- entity cards ---------- */

table.f tr.removed td { background: var(--del-bg); } table.f tr.removed td.m, table.f tr.removed td.k { color: var(--del-ink); }
table.f tr.removed td.k { text-decoration: line-through; }
table.f tr.changed td.m, table.f tr.renamed td.m { color: var(--med); }
table.f .was { color: var(--del-ink); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del-ink) 50%, transparent); display: block; }
table.f .now { color: var(--add-ink); display: block; }
table.f tr.same td { color: var(--muted); }
.more { font-size: 12px; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line-2); }
.ops { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; }
.ops li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 5px 14px; border-top: 1px solid var(--line-2); }
.ops .op { font-weight: 700; }
.ops .op.bad { color: var(--del-ink); } .ops .op.good { color: var(--add-ink); } .ops .op.mid { color: var(--med); }
.ops .tgt { color: var(--ink); } .ops .det { color: var(--muted); display: block; word-break: break-word; }
.warnline { padding: 7px 14px; font-size: 12.5px; color: var(--high); background: var(--high-soft); border-top: 1px solid var(--line-2); }
.sig { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border-top: 1px solid var(--line-2); word-break: break-word; }
.sig .was { color: var(--del-ink); text-decoration: line-through; display: block; }
.sig .now { color: var(--add-ink); display: block; }

/* ---------- routes ---------- */
.routes .r { display: grid; grid-template-columns: 22px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line-2); }
.routes .r:first-child { border-top: 0; }
.meth { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 2px 0; border-radius: 4px; text-align: center; color: #fff; }
.meth.GET { background: var(--get); } .meth.POST { background: var(--post); } .meth.PUT, .meth.PATCH { background: var(--put); }
.meth.DELETE { background: var(--delete); } .meth.other { background: var(--other); }
@media (prefers-color-scheme: dark) { .meth { color: #131312; } }
.routes .p { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.routes .p.removed { text-decoration: line-through; color: var(--del-ink); }
.routes .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
.lock { color: var(--add-ink); } .nolock { color: var(--high); font-weight: 600; }

/* ---------- logic ---------- */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line-2); }
.ba > div { padding: 10px 16px; font-size: 13px; }
.ba > div + div { border-left: 1px solid var(--line-2); }
.ba h5 { margin: 0 0 3px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.why { padding: 9px 16px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line-2); background: var(--panel-2); }
.why b { color: var(--accent); font-weight: 600; }
.constrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line-2); align-items: start; }
.constrow:first-child { border-top: 0; }
.cval { font-family: var(--mono); font-size: 12.5px; }
.cval .was { color: var(--del-ink); text-decoration: line-through; }
.cval .arrow { color: var(--faint); margin: 0 6px; }
.cval .now { color: var(--add-ink); font-weight: 600; }
.prompt-diff { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; padding: 10px 16px; border-top: 1px solid var(--line-2); line-height: 1.6; max-height: 340px; overflow: auto; }
.prompt-diff ins { background: var(--add-bg); color: var(--add-ink); text-decoration: none; }
.prompt-diff del { background: var(--del-bg); color: var(--del-ink); }

/* ---------- diff ---------- */
.diff { border-top: 1px solid var(--line-2); overflow-x: auto; background: var(--panel); }
.diff table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
.diff td.n { width: 1%; color: var(--faint); text-align: right; user-select: none; padding: 0 6px; font-size: 11px; }
.diff tr.a td { background: var(--add-bg); } .diff tr.a td.n { background: var(--add-gutter); color: var(--add-ink); }
.diff tr.d td { background: var(--del-bg); } .diff tr.d td.n { background: var(--del-gutter); color: var(--del-ink); }
.diff tr.hh td { background: var(--panel-2); color: var(--muted); padding: 3px 10px; font-size: 11.5px; }
.diff tr.hl td { box-shadow: inset 3px 0 0 var(--accent); }
.diff td.c { width: 100%; }
.row > .diff, .constrow > .diff { grid-column: 1 / -1; margin: 8px -16px -11px; }
.walk .step > .diff { grid-column: 1 / -1; margin: 6px -18px 0 -10px; }
.routes .r > .diff { grid-column: 1 / -1; margin: 6px -16px -9px; }
.grid2 > .wide { grid-column: 1 / -1; }
.diff td.n.go { cursor: pointer; }
.diff td.n.go:hover { color: var(--accent); text-decoration: underline; }
.ed { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; cursor: pointer; }
.ed:hover { text-decoration: underline; }
.locwrap { display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; min-width: 0; }
.diff .fn { padding: 6px 12px; font-size: 12px; font-family: var(--mono); color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; gap: 8px; }
.callers { font-family: var(--mono); font-size: 12px; border-top: 1px solid var(--line-2); padding: 6px 14px 8px; }
.callers div { padding: 2px 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callers div b { color: var(--ink); font-weight: 500; }
.callers .out { color: var(--med); }

/* ---------- files ---------- */
.fileblock { scroll-margin-top: 76px; }
.fileblock .fh { display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) auto auto; gap: 10px; padding: 10px 14px; align-items: center; cursor: pointer; }
.fileblock .fh .rk { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
.fileblock .fh .path { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
.fileblock .fh .why { all: unset; font-size: 12px; color: var(--muted); display: block; }
.fileblock .stats { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.cat { font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--line-2); color: var(--muted); margin-left: 6px; font-family: var(--sans); font-weight: 500; vertical-align: 1px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
.err { color: var(--high); padding: 40px; font-family: var(--mono); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

@media (max-width: 900px) {
  .top { position: static; }
  section.sec, .fileblock { scroll-margin-top: 64px; }
  .wrap { grid-template-columns: 1fr; gap: 0; padding: 0 12px 100px; }
  nav.rail { position: sticky; top: 0; z-index: 10; max-height: none; overflow-x: auto; display: flex; gap: 4px; padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -12px 16px; padding-left: 12px; }
  nav.rail h6, nav.rail .files { display: none; }
  .rail a.sec { white-space: nowrap; gap: 6px; }
  .top-in { padding: 8px 12px; gap: 8px; }
  .ref { max-width: 100%; order: 5; flex-basis: 100%; }
  .switcher { left: 16px; width: calc(100vw - 32px); }
  .intent { grid-template-columns: 1fr; } .intent > div { border-left: 0; border-top: 1px solid var(--line-2); }
  .ba { grid-template-columns: 1fr; } .ba > div + div { border-left: 0; border-top: 1px solid var(--line-2); }
  .routes .r { grid-template-columns: 22px 54px minmax(0, 1fr); } .routes .r > .locwrap { grid-column: 3; justify-content: flex-start; }
  .row { grid-template-columns: 22px minmax(0, 1fr); } .row > .loc { grid-column: 2; }
  .ops li { grid-template-columns: 1fr; gap: 0; }
  .hero .summary { font-size: 15px; }
  .progress .bar { width: 50px; }
}

/* ---------- first layer: folded cards, data models, under the hood ---------- */
.ktag { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin-right: 8px; }
.stitle .ktag { vertical-align: 2px; }
.attn > .card + .card { margin-top: 8px; }
.dec .dhd { cursor: pointer; }
.dec:not(.open) > .ba, .dec:not(.open) > .trade, .dec:not(.open) > .dfoot, .dec:not(.open) > .diff { display: none; }
.dec .oneline { font-size: 13px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dec .oneline b { color: var(--muted); font-weight: 600; }
.dec.open .oneline, .dec.agreed:not(.peek) .oneline { display: none; }
.dec .dtitle { font-size: 14.5px; }
.foldhint { font-size: 12px; }
.row.attrisk .detail { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#attention .ktag { display: none; }
.agroup .n { color: var(--faint); }
.calm { padding: 12px 16px; color: var(--add-ink); font-size: 14px; }
.foldbar { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 8px 14px; border: 1px dashed var(--line); border-radius: 10px; background: none;
  color: var(--muted); font-size: 13px; cursor: pointer; text-align: left; }
.foldbar .spacer { flex: 1; }
.donebox { display: none; margin-top: 8px; }
.donebox.open { display: block; }
.more-link { margin: 10px 2px 0; font-size: 13px; }
.gstats { margin-top: 8px; font-size: 12.5px; color: var(--faint); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.mcard { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 10px; padding: 10px 12px 11px; cursor: pointer;
  box-shadow: var(--shadow); min-width: 0; transition: border-color .15s, box-shadow .15s; }
.mcard:hover { border-color: var(--faint); }
.mcard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.mcard.added { border-left-color: var(--add-ink); } .mcard.modified { border-left-color: var(--med); } .mcard.removed { border-left-color: var(--del-ink); }
.mcard .mk { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 6px; }
.mcard .mk .stx { font-weight: 700; }
.mcard.added .mk .stx { color: var(--add-ink); } .mcard.modified .mk .stx { color: var(--med); } .mcard.removed .mk .stx { color: var(--del-ink); }
.mcard .mn { font-family: var(--mono); font-size: 13.5px; font-weight: 650; color: var(--ink); margin-top: 2px; word-break: break-word; }
.mcard.removed .mn { text-decoration: line-through; color: var(--muted); }
.mcard .mfl { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 5px; display: flex; gap: 8px; flex-wrap: wrap; }
.mcard .mfl .cnt { font-family: var(--sans); color: var(--faint); }
.mcard .fc.added { color: var(--add-ink); } .mcard .fc.removed { color: var(--del-ink); text-decoration: line-through; } .mcard .fc.changed, .mcard .fc.renamed { color: var(--med); }
.mcard .mused { font-size: 12px; color: var(--faint); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frow { padding: 10px 16px; border-top: 1px solid var(--line-2); cursor: pointer; }
.frow:first-child { border-top: 0; }
.frow:hover, .frow.sel { background: var(--panel-2); }
.frow .ft { font-size: 14px; font-weight: 600; color: var(--ink); }
.frow .fg { font-weight: 400; color: var(--muted); font-size: 13px; }
.frow .fs { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; }
.frow .fs .ar { color: var(--faint); }
#map { margin-top: 12px; }
.hoodtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.hoodtabs .btn .n { color: var(--faint); margin-left: 6px; font-variant-numeric: tabular-nums; }
.hoodtabs .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
section.sec.sub { margin: 14px 0 0; }
section.sec.sub > h2 { display: none; }
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="main"><div class="empty" style="padding:40px 0">Loading report…</div></main>
</div>
<div class="toast" id="toast"></div>
<div class="switcher" id="switcher" role="dialog" aria-label="Review another branch"></div>
<button class="backbtn" id="backbtn" title="Back to where you were (Backspace)">↩ Back</button>
<script>
(() => {
"use strict";
let R = null;                  // report
let HUNKS = {};                // id -> {file, hunk}
let FILES = {};                // path -> file
let reviewed = {};
let riskFilter = "all";
let topicFilter = "all";        // topic id, or "all"
const groupOpen = {};           // "section:topic" -> bool (user's choice survives re-render)
const secCollapsed = {};        // section id -> bool
const backStack = [];           // scroll positions to return to
const STATIC = !!window.__GLANCE_REPORT__;

// ------------------------------------------------------------------ helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// ------------------------------------------------------------------ open in editor
function editorHref(path, line) { return `vscode://file${R.repo_path}/${path}${line ? ":" + line : ""}`; }
async function openInEditor(path, line) {
  if (!STATIC) {
    try {
      const r = await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path, line }) });
      if (r.ok) { toast(`Opened ${path.split("/").pop()}${line ? ":" + line : ""} in VS Code`); return; }
      if (r.status === 404) { toast("That file isn't in the working tree"); return; }
    } catch {}
  }
  location.href = editorHref(path, line);   // static report, or no `code` CLI: let the OS handle vscode://
}
function editorLink(path, line, label = "VS Code ↗") {
  return h("a", { class: "ed", href: editorHref(path, line), title: `Open ${path}${line ? ":" + line : ""} in VS Code`,
    onclick: e => { e.preventDefault(); e.stopPropagation(); openInEditor(path, line); } }, label);
}
// ------------------------------------------------------------------ topics
function topicOf(x) { return x.topic || (x.file && FILES[x.file] && FILES[x.file].topic) || "other"; }
function topicLabel(t) { const x = (R.topics || []).find(x => x.id === t); return x ? x.label : (t === "other" ? "Other" : t); }
function inTopic(x) { return topicFilter === "all" || topicOf(x) === topicFilter; }
function topicSeverity(t) {
  const rs = R.risks.filter(r => topicOf(r) === t);
  return rs.some(r => r.severity === "high") ? "high" : rs.some(r => r.severity === "medium") ? "medium" : rs.length ? "low" : "none";
}
function setTopic(t) {
  topicFilter = topicFilter === t ? "all" : t;
  render();
  document.getElementById("main").scrollIntoView({ block: "start" });
}

// Split a section's items into collapsible per-topic groups (items keep the section's own order; groups are
// ordered by their first item, so the group holding the most important item comes first).
function topicGroups(sec, items, build, peek) {
  const kids = x => [].concat(x).filter(Boolean);
  const topics = [...new Set(items.map(topicOf))];
  if (topics.length <= 1) return kids(build(items));
  const collapse = items.length > 8;
  return topics.map(t => {
    const sub = items.filter(x => topicOf(x) === t);
    const key = sec + ":" + t;
    const open = key in groupOpen ? groupOpen[key] : !collapse;
    const g = h("div", { class: "tgroup" + (open ? " open" : ""), id: `g-${sec}-${t}`, "data-key": key });
    const sev = topicSeverity(t);
    const hd = h("button", { class: "tg-hd", onclick: () => { const o = g.classList.toggle("open"); groupOpen[key] = o; } },
      h("span", { class: "chev" }, "▶"), topicLabel(t), h("span", { class: "cnt" }, String(sub.length)),
      sev !== "none" ? h("span", { class: "dot " + sev, title: `${sev}-severity risk in this topic` }) : null,
      h("span", { class: "peek" }, peek ? (sub.slice(0, 4).map(peek).filter(Boolean).join(" · ") + (sub.length > 4 ? " · …" : "")).replace(/^ · …$/, "") : ""),
      h("span", { class: "spacer" }));
    g.append(hd, h("div", { class: "tg-body" }, ...kids(build(sub))));
    return g;
  });
}

// ------------------------------------------------------------------ back
function rememberSpot() {
  const y = window.scrollY;
  if (!backStack.length || Math.abs(backStack[backStack.length - 1] - y) > 40) backStack.push(y);
  if (backStack.length > 50) backStack.shift();
  updateBack();
}
function goBack() {
  if (!backStack.length) return;
  window.scrollTo({ top: backStack.pop(), behavior: "smooth" });
  updateBack();
}
function updateBack() { const b = document.getElementById("backbtn"); if (b) b.classList.toggle("on", backStack.length > 0); }
function reveal(el) {    // open whatever collapsed section/group hides el
  for (let p = el; p; p = p.parentElement) {
    if (p.classList?.contains("tgroup") && !p.classList.contains("open")) { p.classList.add("open"); groupOpen[p.dataset.key] = true; }
    if (p.tagName === "SECTION" && p.classList.contains("collapsed")) { p.classList.remove("collapsed"); secCollapsed[p.id] = false; }
  }
}

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800); }

function storeKey() { return `glance:${R.repo_path}:${R.base.rev}:${R.head.ref}`; }
function loadReviewed() {
  try { reviewed = JSON.parse(localStorage.getItem(storeKey()) || "{}") || {}; } catch { reviewed = {}; }
  try { dverdicts = JSON.parse(localStorage.getItem(storeKey() + ":decisions") || "{}") || {}; } catch { dverdicts = {}; }
  try { flags = JSON.parse(localStorage.getItem(storeKey() + ":flags") || "{}") || {}; } catch { flags = {}; }
  try { probeEdits = JSON.parse(localStorage.getItem(storeKey() + ":probes") || "{}") || {}; } catch { probeEdits = {}; }
  try { averdicts = JSON.parse(localStorage.getItem(storeKey() + ":assumptions") || "{}") || {}; } catch { averdicts = {}; }
}
let dverdicts = {};                // decision id -> {v: "agree"|"question"|"disagree", note, at, resolved}
let flags = {};                    // "row:<scenario>:<i>" | "q:<question>" -> {note}: things to ask the agent about
let averdicts = {};                // assumption id -> {v: "accept"|"ask", note, resolved}
function saveAverdicts() { try { localStorage.setItem(storeKey() + ":assumptions", JSON.stringify(averdicts)); } catch {} updateProgress(); updateFeedback(); }
let probeEdits = {};               // scenario id -> {rows: {i: input}, extra: [{case, input}]}: your inputs, kept per branch
const probeRuns = {}, probeBusy = {}, probeOK = new Set();   // results live for this page only: re-running is cheap
function saveProbeEdits() { try { localStorage.setItem(storeKey() + ":probes", JSON.stringify(probeEdits)); } catch {} }
function saveVerdicts() { try { localStorage.setItem(storeKey() + ":decisions", JSON.stringify(dverdicts)); } catch {} updateProgress(); updateFeedback(); }
function saveFlags() { try { localStorage.setItem(storeKey() + ":flags", JSON.stringify(flags)); } catch {} updateFeedback(); }
function saveReviewed() { try { localStorage.setItem(storeKey(), JSON.stringify(reviewed)); } catch {} updateProgress(); renderRail(); }

// Cards on the first layer start folded to one line; what you opened stays open across re-renders.
const openCards = new Set();
function toggleOpen(el, key) {
  const on = el.classList.toggle("open");
  if (on) openCards.add(key); else openCards.delete(key);
  const hint = el.querySelector(".foldhint");
  if (hint) hint.textContent = on ? hint.dataset.less : hint.dataset.more;
}
function foldHint(el, key, more = "details", less = "less") {
  const b = h("button", { class: "toggle foldhint", "data-more": more, "data-less": less }, openCards.has(key) ? less : more);
  b.addEventListener("click", e => { e.stopPropagation(); toggleOpen(el, key); });
  return b;
}
let DEFAULTS = {};                 // id -> pre-checked? (routine items, low risks)
function isChecked(id) { return id in reviewed ? !!reviewed[id] : !!DEFAULTS[id]; }
function check(id, rowEl) {
  const c = h("input", { type: "checkbox", class: "chk", title: DEFAULTS[id] ? "Pre-checked as routine — untick to review it" : "Mark reviewed (collapses it)" });
  c.dataset.rid = id;
  c.checked = isChecked(id);
  c.addEventListener("click", e => e.stopPropagation());
  if (rowEl) {
    rowEl.dataset.rid = id;
    if (c.checked) rowEl.classList.add("done");

    if (e.key === "Escape") { e.preventDefault(); closeSwitcher(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); swSel = Math.min(swSel + 1, items.length - 1); items = draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); swSel = Math.max(swSel - 1, 0); items = draw(); }
    else if (e.key === "Enter") { e.preventDefault(); pick(items[swSel]); }
  };
  q.addEventListener("keydown", keys);
  base.addEventListener("keydown", e => { if (e.key === "Escape" || e.key === "Enter") keys(e); });
  try {
    const r = await fetch("/api/branches", { cache: "no-store" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
    swBranches = data.branches;
    box.querySelector("#sw-refs").append(...swBranches.map(b => h("option", { value: b.name })));
    if (swOpen) items = draw();
  } catch (e) {
    list.innerHTML = "";
    list.append(h("li", { class: "sw-empty" }, `Couldn't list branches: ${e.message}`));
  }
}

function closeSwitcher() {
  swOpen = false;
  document.getElementById("switcher").classList.remove("open");
  if (R) renderTop();
}

async function switchTo(head, base) {
  try {
    const r = await fetch("/api/switch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ head, base }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { toast(data.error || "Couldn't switch"); return; }
  } catch { toast("Couldn't reach the glance server"); return; }
  closeSwitcher();
  switching = head || "working tree";
  renderTop();
  for (let i = 0; i < 1200; i++) {             // big branches take a minute or two to analyze
    await new Promise(res => setTimeout(res, 1500));
    let next;
    try { next = await fetchReport(); } catch { continue; }
    if (next._rebuilding) continue;
    const label = switching;
    switching = null;
    if (next._switch_error) { renderTop(); toast(`Couldn't switch: ${next._switch_error}`); return; }
    R = next; render(); window.scrollTo(0, 0);
    toast(`Reviewing ${label}`);
    if ((R.llm || {}).status === "running") poll();
    return;
  }
  switching = null; renderTop();
}

document.addEventListener("mousedown", e => {
  if (swOpen && !e.target.closest("#switcher") && !e.target.closest("#refbtn")) closeSwitcher();
});

async function fetchReport() {
  const r = await fetch("/api/report", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

let polling = false;
async function poll(untilChangedFrom) {
  if (polling) return;
  polling = true;
  try {
    for (let i = 0; i < 400; i++) {
      await new Promise(res => setTimeout(res, 2500));
      const next = await fetchReport();
      const llmChanged = (next.llm || {}).status !== (R.llm || {}).status;
      const concernsChanged = JSON.stringify((next.llm || {}).concerns || []) !== JSON.stringify((R.llm || {}).concerns || []);
      if (!llmChanged && !untilChangedFrom && concernsChanged) {
        const was = Object.fromEntries(((R.llm || {}).concerns || []).map(c => [c.id, c]));
        R = next; render();
        for (const c of (R.llm.concerns || [])) if (was[c.id]?.rechecking && !c.rechecking)
          toast(c.recheck_error ? "Re-check failed" : c.verdict === "fixed" ? `Fixed: ${c.title}` : c.verdict === "partly_fixed" ? `Partly fixed: ${c.title}` : `Still there: ${c.title}`);
      }
      const idChanged = untilChangedFrom && next.id !== untilChangedFrom;
      if (next.id !== R.id || llmChanged) {
        const newReport = next.id !== R.id;
        R = next; render();
        if (newReport) toast((R.resolved || []).length ? `Report refreshed · ✓ ${plural(R.resolved.length, "risk")} resolved` : "Report refreshed");
        if ((R.llm || {}).status === "ok" && llmChanged) toast("Model pass finished");
      }
      if ((R.llm || {}).status !== "running" && !((R.llm || {}).rechecking || []).length && !next._rebuilding && (!untilChangedFrom || next.id !== untilChangedFrom) && !refreshing) break;
    }
  } catch (e) { console.warn(e); }
  polling = false;
}

async function recheckConcern(cid) {
  try {
    const r = await fetch("/api/recheck", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: cid }) });
    if (!r.ok) { toast("Couldn't start the re-check"); return; }
    const c = (R.llm.concerns || []).find(c => c.id === cid); if (c) c.rechecking = true;
    render(); toast("Re-checking against the current code…"); poll();
  } catch { toast("Couldn't reach the glance server"); }
}

let refreshing = false;
async function refresh() {
  refreshing = true;
  const b = document.getElementById("refresh");
  if (b) { b.disabled = true; b.textContent = "Refreshing…"; }
  const before = R.id;
  try { await fetch("/api/refresh", { method: "POST" }); } catch {}
  if (polling) { for (let i = 0; i < 240 && R.id === before; i++) await new Promise(r => setTimeout(r, 500)); }   // the running watcher picks it up (2 min cap)
  else await poll(before);
  refreshing = false;
  const b2 = document.getElementById("refresh");
  if (b2) { b2.disabled = false; b2.textContent = "↻ Refresh"; }
}

async function boot() {
  try {
    R = STATIC ? window.__GLANCE_REPORT__ : await fetchReport();
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="err">Couldn't load report: ${esc(e.message)}</div>`;
    return;
  }
  render();
  if (!STATIC && (R.llm || {}).status === "running") poll();
}
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey) return;
  if (e.key === "r" && !STATIC) refresh();
  if (e.key === "Backspace" && backStack.length) { e.preventDefault(); goBack(); }
  if (e.key === "Escape" && drawerOwner) drawerCloser();
});
document.getElementById("backbtn").addEventListener("click", goBack);
boot();
})();
</script>
