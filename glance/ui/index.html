<style>

}

  :root {
    --bg: #131312; --panel: #1b1b19; --panel-2: #181816; --ink: #ecebe5; --ink-2: #d2d0c8; --muted: #9c988e; --faint: #6e6b63;
    --line: #2d2c28; --line-2: #24231f; --accent: #4cc7b6; --accent-soft: #15302c;
    --add-bg: rgba(46,160,67,.14); --add-ink: #6fd08b; --add-gutter: rgba(46,160,67,.22); --del-bg: rgba(248,81,73,.13); --del-ink: #ff8a80; --del-gutter: rgba(248,81,73,.22);
    --high: #ff6b63; --high-soft: rgba(255,107,99,.12); --med: #f0b54a; --med-soft: rgba(240,181,74,.12); --low: #9c988e; --low-soft: rgba(156,152,142,.12);

/* ---------- top bar ---------- */

.add { color: var(--add-ink); } .del { color: var(--del-ink); }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; max-width: none; margin: 0 auto; padding: 22px 20px 120px; }

.tgroup + .tgroup { margin-top: 8px; }

  box-shadow: var(--shadow); padding: 9px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink); }

.st-h + .urow { border-top: 0; }
.urow .nm { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }

.tag-route { font-size: 10.5px; padding: 0 6px; border-radius: 4px; color: var(--get); border: 1px solid color-mix(in srgb, var(--get) 40%, transparent); }
.chap .tg-body { padding-left: 0; border-left: 0; margin: 0; }
.chap .tgroup { padding: 6px 12px; } .chap .tgroup + .tgroup { margin-top: 0; }

/* ---------- overview ---------- */
.hero { padding: 18px 20px; }
.hero .headline { font-size: 13px; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }

.hero ul.glance { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.hero ul.glance li { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--ink-2); }
.llm-state { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 10px 20px; border-top: 1px solid var(--line-2); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.intent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.intent > div { padding: 14px 18px; border-left: 1px solid var(--line-2); }
.intent > div:first-child { border-left: 0; }
.intent h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 650; }
.intent ul { margin: 0; padding: 0 0 0 16px; font-size: 13px; }
.intent li { margin: 3px 0; }
.intent .done h4 { color: var(--add-ink); } .intent .extra h4 { color: var(--med); } .intent .missing h4 { color: var(--high); }
.asked { padding: 12px 18px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; color: var(--ink-2); }
.asked b { font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
.walk { counter-reset: w; padding: 6px 0; }
.walk .step { display: grid; grid-template-columns: 34px 1fr; padding: 8px 18px 8px 10px; }
.walk .step::before { counter-increment: w; content: counter(w); font-weight: 650; color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- rows ---------- */
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line-2); align-items: start; }
.row:first-child { border-top: 0; }
/* reviewed (checked) items collapse to their title line; click the line to peek, untick to restore */
.done:not(.peek) .title, .done:not(.peek) .nm, .done:not(.peek) .p, .done:not(.peek) .path { opacity: .55; }
.row.done:not(.peek) > .body > :not(.title), .row.done:not(.peek) > .diff,
.constrow.done:not(.peek) > .body > :not(.title), .constrow.done:not(.peek) > .diff,
.routes .r.done:not(.peek) > .body > :not(.p), .routes .r.done:not(.peek) > .diff,
.card.ent.done:not(.peek) > :not(.hd), .card.ent.done:not(.peek) .hd .sub,
.card.bl.done:not(.peek) > :not(.row),
.fileblock.done:not(.peek) > :not(.fh), .fileblock.done:not(.peek) .fh .why,

.row.done:not(.peek), .constrow.done:not(.peek), .urow.done:not(.peek) { padding-top: 7px; padding-bottom: 7px; cursor: pointer; }
.card.ent.done:not(.peek) .hd, .card.bl.done:not(.peek) { cursor: pointer; }
.tg-hd .rv { font-weight: 500; font-size: 12px; color: var(--muted); }
.tg-hd .rv.all { color: var(--add-ink); }
.row .title { font-weight: 560; color: var(--ink); }
.row .detail { color: var(--ink-2); font-size: 13px; margin-top: 2px; white-space: pre-line; }
.loc { font-family: var(--mono); font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38ch; direction: rtl; text-align: right; }
.loc:hover { color: var(--accent); text-decoration: underline; }
.row .meta { display: flex; gap: 8px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
.chk { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--faint); border-radius: 4px; margin: 2px 0 0; cursor: pointer; display: grid; place-content: center; background: var(--panel); }
.chk:checked { background: var(--accent); border-color: var(--accent); }
.chk:checked::after { content: ""; width: 8px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.toggle { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: 0; padding: 0; }
.toggle:hover { text-decoration: underline; }
.sev { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.sev.high { color: var(--high); background: var(--high-soft); } .sev.medium { color: var(--med); background: var(--med-soft); } .sev.low { color: var(--low); background: var(--low-soft); }
.src { font-size: 10.5px; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
.filters { display: flex; gap: 6px; margin: -4px 0 10px; flex-wrap: wrap; }
.filters .btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---------- entity cards ---------- */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(520px, 100%), 1fr)); gap: 12px; }
.ent { overflow: hidden; }
.ent .hd { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 12px 14px 10px; align-items: start; }
.ent .nm { font-family: var(--mono); font-size: 13.5px; font-weight: 600; word-break: break-word; }

.st { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.st.added { color: var(--add-ink); background: var(--add-bg); } .st.removed { color: var(--del-ink); background: var(--del-bg); }

.fw { font-size: 11px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
table.f { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
table.f td { padding: 4px 10px; border-top: 1px solid var(--line-2); vertical-align: top; word-break: break-word; }

table.f tr.added td { background: var(--add-bg); } table.f tr.added td.m { color: var(--add-ink); }
table.f tr.removed td { background: var(--del-bg); } table.f tr.removed td.m, table.f tr.removed td.k { color: var(--del-ink); }
table.f tr.removed td.k { text-decoration: line-through; }
table.f tr.changed td.m, table.f tr.renamed td.m { color: var(--med); }
table.f .was { color: var(--del-ink); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--del-ink) 50%, transparent); display: block; }
table.f .now { color: var(--add-ink); display: block; }
table.f tr.same td { color: var(--muted); }
.more { font-size: 12px; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line-2); }
.ops { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 12px; }
.ops li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 5px 14px; border-top: 1px solid var(--line-2); }
.ops .op { font-weight: 700; }
.ops .op.bad { color: var(--del-ink); } .ops .op.good { color: var(--add-ink); } .ops .op.mid { color: var(--med); }
.ops .tgt { color: var(--ink); } .ops .det { color: var(--muted); display: block; word-break: break-word; }
.warnline { padding: 7px 14px; font-size: 12.5px; color: var(--high); background: var(--high-soft); border-top: 1px solid var(--line-2); }
.sig { font-family: var(--mono); font-size: 12px; padding: 8px 14px; border-top: 1px solid var(--line-2); word-break: break-word; }
.sig .was { color: var(--del-ink); text-decoration: line-through; display: block; }
.sig .now { color: var(--add-ink); display: block; }

/* ---------- routes ---------- */
.routes .r { display: grid; grid-template-columns: 22px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 16px; border-top: 1px solid var(--line-2); }
.routes .r:first-child { border-top: 0; }
.meth { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 2px 0; border-radius: 4px; text-align: center; color: #fff; }
.meth.GET { background: var(--get); } .meth.POST { background: var(--post); } .meth.PUT, .meth.PATCH { background: var(--put); }
.meth.DELETE { background: var(--delete); } .meth.other { background: var(--other); }
@media (prefers-color-scheme: dark) { .meth { color: #131312; } }
.routes .p { font-family: var(--mono); font-size: 13px; word-break: break-all; }
.routes .p.removed { text-decoration: line-through; color: var(--del-ink); }
.routes .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 11.5px; color: var(--muted); }
.lock { color: var(--add-ink); } .nolock { color: var(--high); font-weight: 600; }

/* ---------- logic ---------- */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-top: 1px solid var(--line-2); }
.ba > div { padding: 10px 16px; font-size: 13px; }
.ba > div + div { border-left: 1px solid var(--line-2); }
.ba h5 { margin: 0 0 3px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; }
.why { padding: 9px 16px; font-size: 13px; color: var(--ink-2); border-top: 1px solid var(--line-2); background: var(--panel-2); }
.why b { color: var(--accent); font-weight: 600; }
.constrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line-2); align-items: start; }
.constrow:first-child { border-top: 0; }
.cval { font-family: var(--mono); font-size: 12.5px; }
.cval .was { color: var(--del-ink); text-decoration: line-through; }
.cval .arrow { color: var(--faint); margin: 0 6px; }
.cval .now { color: var(--add-ink); font-weight: 600; }
.prompt-diff { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; padding: 10px 16px; border-top: 1px solid var(--line-2); line-height: 1.6; max-height: 340px; overflow: auto; }
.prompt-diff ins { background: var(--add-bg); color: var(--add-ink); text-decoration: none; }
.prompt-diff del { background: var(--del-bg); color: var(--del-ink); }

/* ---------- diff ---------- */
.diff { border-top: 1px solid var(--line-2); overflow-x: auto; background: var(--panel); }
.diff table { border-collapse: collapse; width: 100%; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.diff td { padding: 0 10px; white-space: pre; vertical-align: top; }
.diff td.n { width: 1%; color: var(--faint); text-align: right; user-select: none; padding: 0 6px; font-size: 11px; }
.diff tr.a td { background: var(--add-bg); } .diff tr.a td.n { background: var(--add-gutter); color: var(--add-ink); }
.diff tr.d td { background: var(--del-bg); } .diff tr.d td.n { background: var(--del-gutter); color: var(--del-ink); }
.diff tr.hh td { background: var(--panel-2); color: var(--muted); padding: 3px 10px; font-size: 11.5px; }
.diff tr.hl td { box-shadow: inset 3px 0 0 var(--accent); }
.diff td.c { width: 100%; }
.row > .diff, .constrow > .diff { grid-column: 1 / -1; margin: 8px -16px -11px; }
.walk .step > .diff { grid-column: 1 / -1; margin: 6px -18px 0 -10px; }
.routes .r > .diff { grid-column: 1 / -1; margin: 6px -16px -9px; }
.grid2 > .wide { grid-column: 1 / -1; }
.diff td.n.go { cursor: pointer; }
.diff td.n.go:hover { color: var(--accent); text-decoration: underline; }
.ed { font-size: 11.5px; color: var(--accent); text-decoration: none; white-space: nowrap; cursor: pointer; }
.ed:hover { text-decoration: underline; }
.locwrap { display: flex; gap: 8px; align-items: baseline; justify-content: flex-end; min-width: 0; }
.diff .fn { padding: 6px 12px; font-size: 12px; font-family: var(--mono); color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; gap: 8px; }
.callers { font-family: var(--mono); font-size: 12px; border-top: 1px solid var(--line-2); padding: 6px 14px 8px; }
.callers div { padding: 2px 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callers div b { color: var(--ink); font-weight: 500; }
.callers .out { color: var(--med); }

/* ---------- files ---------- */
.fileblock { scroll-margin-top: 76px; }
.fileblock .fh { display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) auto auto; gap: 10px; padding: 10px 14px; align-items: center; cursor: pointer; }
.fileblock .fh .rk { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
.fileblock .fh .path { font-family: var(--mono); font-size: 13px; font-weight: 600; word-break: break-all; }
.fileblock .fh .why { all: unset; font-size: 12px; color: var(--muted); display: block; }
.fileblock .stats { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.cat { font-size: 10.5px; padding: 0 6px; border-radius: 4px; background: var(--line-2); color: var(--muted); margin-left: 6px; font-family: var(--sans); font-weight: 500; vertical-align: 1px; }

.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
.err { color: var(--high); padding: 40px; font-family: var(--mono); }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); }

@media (max-width: 900px) {
  .top { position: static; }
  section.sec, .fileblock { scroll-margin-top: 64px; }
  .wrap { grid-template-columns: 1fr; gap: 0; padding: 0 12px 100px; }
  nav.rail { position: sticky; top: 0; z-index: 10; max-height: none; overflow-x: auto; display: flex; gap: 4px; padding: 8px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -12px 16px; padding-left: 12px; }
  nav.rail h6, nav.rail .files { display: none; }
  .rail a.sec { white-space: nowrap; gap: 6px; }
  .top-in { padding: 8px 12px; gap: 8px; }
  .ref { max-width: 100%; order: 5; flex-basis: 100%; }
  .intent { grid-template-columns: 1fr; } .intent > div { border-left: 0; border-top: 1px solid var(--line-2); }
  .ba { grid-template-columns: 1fr; } .ba > div + div { border-left: 0; border-top: 1px solid var(--line-2); }
  .routes .r { grid-template-columns: 22px 54px minmax(0, 1fr); } .routes .r > .locwrap { grid-column: 3; justify-content: flex-start; }
  .row { grid-template-columns: 22px minmax(0, 1fr); } .row > .loc { grid-column: 2; }
  .ops li { grid-template-columns: 1fr; gap: 0; }
  .hero .summary { font-size: 15px; }
  .progress .bar { width: 50px; }
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<div class="wrap">
  <nav class="rail" id="rail"></nav>
  <main id="main"><div class="empty" style="padding:40px 0">Loading report…</div></main>
</div>
<div class="toast" id="toast"></div>
<button class="backbtn" id="backbtn" title="Back to where you were (Backspace)">↩ Back</button>
<script>
(() => {
"use strict";
let R = null;                  // report
let HUNKS = {};                // id -> {file, hunk}
let FILES = {};                // path -> file
let reviewed = {};
let riskFilter = "all";
let topicFilter = "all";        // topic id, or "all"
const groupOpen = {};           // "section:topic" -> bool (user's choice survives re-render)
const secCollapsed = {};        // section id -> bool
const backStack = [];           // scroll positions to return to
const STATIC = !!window.__GLANCE_REPORT__;

// ------------------------------------------------------------------ helpers
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
// ------------------------------------------------------------------ open in editor
function editorHref(path, line) { return `vscode://file${R.repo_path}/${path}${line ? ":" + line : ""}`; }
async function openInEditor(path, line) {
  if (!STATIC) {
    try {
      const r = await fetch("/api/open", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path, line }) });
      if (r.ok) { toast(`Opened ${path.split("/").pop()}${line ? ":" + line : ""} in VS Code`); return; }
      if (r.status === 404) { toast("That file isn't in the working tree"); return; }
    } catch {}
  }
  location.href = editorHref(path, line);   // static report, or no `code` CLI: let the OS handle vscode://
}
function editorLink(path, line, label = "VS Code ↗") {
  return h("a", { class: "ed", href: editorHref(path, line), title: `Open ${path}${line ? ":" + line : ""} in VS Code`,
    onclick: e => { e.preventDefault(); e.stopPropagation(); openInEditor(path, line); } }, label);
}
// ------------------------------------------------------------------ topics
function topicOf(x) { return x.topic || (x.file && FILES[x.file] && FILES[x.file].topic) || "other"; }
function topicLabel(t) { const x = (R.topics || []).find(x => x.id === t); return x ? x.label : (t === "other" ? "Other" : t); }
function inTopic(x) { return topicFilter === "all" || topicOf(x) === topicFilter; }
function topicSeverity(t) {
  const rs = R.risks.filter(r => topicOf(r) === t);
  return rs.some(r => r.severity === "high") ? "high" : rs.some(r => r.severity === "medium") ? "medium" : rs.length ? "low" : "none";
}
function setTopic(t) {
  topicFilter = topicFilter === t ? "all" : t;
  render();
  document.getElementById("main").scrollIntoView({ block: "start" });
}

// Split a section's items into collapsible per-topic groups (items keep the section's own order; groups are
// ordered by their first item, so the group holding the most important item comes first).
function topicGroups(sec, items, build, peek) {
  const kids = x => [].concat(x).filter(Boolean);
  const topics = [...new Set(items.map(topicOf))];
  if (topics.length <= 1) return kids(build(items));
  const collapse = items.length > 8;
  return topics.map(t => {
    const sub = items.filter(x => topicOf(x) === t);
    const key = sec + ":" + t;
    const open = key in groupOpen ? groupOpen[key] : !collapse;
    const g = h("div", { class: "tgroup" + (open ? " open" : ""), id: `g-${sec}-${t}`, "data-key": key });
    const sev = topicSeverity(t);
    const hd = h("button", { class: "tg-hd", onclick: () => { const o = g.classList.toggle("open"); groupOpen[key] = o; } },
      h("span", { class: "chev" }, "▶"), topicLabel(t), h("span", { class: "cnt" }, String(sub.length)),
      sev !== "none" ? h("span", { class: "dot " + sev, title: `${sev}-severity risk in this topic` }) : null,
      h("span", { class: "peek" }, peek ? (sub.slice(0, 4).map(peek).filter(Boolean).join(" · ") + (sub.length > 4 ? " · …" : "")).replace(/^ · …$/, "") : ""),
      h("span", { class: "spacer" }));
    g.append(hd, h("div", { class: "tg-body" }, ...kids(build(sub))));
    return g;
  });
}

// ------------------------------------------------------------------ back
function rememberSpot() {
  const y = window.scrollY;
  if (!backStack.length || Math.abs(backStack[backStack.length - 1] - y) > 40) backStack.push(y);
  if (backStack.length > 50) backStack.shift();
  updateBack();
}
function goBack() {
  if (!backStack.length) return;
  window.scrollTo({ top: backStack.pop(), behavior: "smooth" });
  updateBack();
}
function updateBack() { const b = document.getElementById("backbtn"); if (b) b.classList.toggle("on", backStack.length > 0); }
function reveal(el) {    // open whatever collapsed section/group hides el
  for (let p = el; p; p = p.parentElement) {
    if (p.classList?.contains("tgroup") && !p.classList.contains("open")) { p.classList.add("open"); groupOpen[p.dataset.key] = true; }
    if (p.tagName === "SECTION" && p.classList.contains("collapsed")) { p.classList.remove("collapsed"); secCollapsed[p.id] = false; }
  }
}

function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 1800); }

function storeKey() { return `glance:${R.repo_path}:${R.base.rev}:${R.head.ref}`; }
function loadReviewed() { try { reviewed = JSON.parse(localStorage.getItem(storeKey()) || "{}") || {}; } catch { reviewed = {}; } }
function saveReviewed() { try { localStorage.setItem(storeKey(), JSON.stringify(reviewed)); } catch {} updateProgress(); }

function check(id, rowEl) {
  const c = h("input", { type: "checkbox", class: "chk", title: "Mark reviewed (collapses it)" });
  c.dataset.rid = id;
  c.checked = !!reviewed[id];
  c.addEventListener("click", e => e.stopPropagation());
  if (rowEl) {
    rowEl.dataset.rid = id;
    if (c.checked) rowEl.classList.add("done");
    rowEl.addEventListener("click", e => {          // click a collapsed item to peek at it
      if (!rowEl.classList.contains("done") || e.target.closest("a, button, input, textarea, .loc, .diff, .ftable")) return;
      rowEl.classList.toggle("peek");
    });
  }
  c.addEventListener("change", () => {
    if (c.checked) reviewed[id] = 1; else delete reviewed[id];
    for (const el of document.querySelectorAll(`[data-rid="${CSS.escape(id)}"]`)) {
      if (el.tagName === "INPUT") el.checked = c.checked;
      else { el.classList.toggle("done", c.checked); el.classList.remove("peek"); }
    }
    saveReviewed();
    renderRailFiles();
    syncGroups(c.checked ? c.closest(".tgroup") : null);
  });
  return c;
}

// Group headers show "n/m reviewed"; ticking the last item in a group closes it.
function syncGroups(justFinished) {
  for (const g of document.querySelectorAll(".tgroup")) {
    const items = [...g.querySelectorAll(".tg-body [data-rid]:not(input)")];
    const hd = g.querySelector(".tg-hd");
    let rv = hd.querySelector(".rv");
    if (!items.length) { if (rv) rv.remove(); continue; }
    const done = items.filter(el => el.classList.contains("done")).length;
    if (!rv) { rv = h("span", { class: "rv" }); hd.querySelector(".cnt").after(rv); }
    rv.textContent = done ? (done === items.length ? `✓ ${done}/${items.length}` : `${done}/${items.length} reviewed`) : "";
    rv.classList.toggle("all", done === items.length);
    if (g === justFinished && done === items.length) { g.classList.remove("open"); groupOpen[g.dataset.key] = false; }
  }
}

function reviewables() {
  const ids = [];
  R.risks.forEach(r => ids.push(r.id));
  R.changes.filter(c => c.kind !== "function" || c.signature_changed || c.status !== "modified").forEach(c => ids.push(c.id));
  R.files.forEach(f => ids.push("f:" + f.path));
  return ids;
}
function updateProgress() {
  const ids = reviewables();
  const done = ids.filter(i => reviewed[i]).length;
  const el = document.getElementById("prog");
  if (!el) return;
  el.querySelector("span.t").textContent = `${done}/${ids.length} reviewed`;
  el.querySelector(".bar > span").style.width = (ids.length ? (100 * done / ids.length) : 0) + "%";
}

// ------------------------------------------------------------------ diff rendering
function diffTable(hunkIds, opts = {}) {
  const wrap = h("div", { class: "diff" });
  const byFile = {};
  for (const id of hunkIds) {
    const x = HUNKS[id];
    if (!x) continue;
    (byFile[x.file] = byFile[x.file] || []).push(x.hunk);
  }
  const files = Object.keys(byFile);
  if (!files.length) { wrap.append(h("div", { class: "empty", style: "padding:8px 12px" }, "No diff lines for this item.")); return wrap; }
  for (const f of files) {
    if (opts.showFile !== false) wrap.append(h("div", { class: "fn" }, h("span", {}, f), h("span", { class: "locwrap" }, h("a", { href: "#file-" + (FILES[f] || {}).rank, onclick: e => { e.preventDefault(); jumpFile(f); } }, "full diff"), editorLink(f, byFile[f][0]?.new_start))));
    const t = h("table");
    for (const hk of byFile[f].sort((a, b) => a.new_start - b.new_start)) {
      t.append(h("tr", { class: "hh" }, h("td", { colspan: 3 }, `@@ -${hk.old_start},${hk.old_len} +${hk.new_start},${hk.new_len} @@ ${hk.header || ""}`)));
      let next = hk.new_start || 1;   // where a deleted line would sit in the current file
      for (const l of hk.lines) {
        const cls = l[0] === "+" ? "a" : l[0] === "-" ? "d" : "";
        const hl = opts.highlightLine && (l[2] === opts.highlightLine) ? " hl" : "";
        const target = l[2] ?? next;
        if (l[2] != null) next = l[2] + 1;
        const go = { class: "n go", title: `Open in VS Code at line ${target}`, onclick: () => openInEditor(f, target) };
        t.append(h("tr", { class: cls + hl }, h("td", go, l[1] ?? ""), h("td", go, l[2] ?? ""), h("td", { class: "c" }, (l[0] === " " ? " " : l[0]) + l[3])));
      }
    }
    wrap.append(t);
  }
  return wrap;
}

function codeToggle(container, hunkIds, label = "show code", opts = {}) {
  if (!hunkIds || !hunkIds.length) return null;
  let open = null;
  const b = h("button", { class: "toggle" }, label);
  b.addEventListener("click", () => {
    const host = container.closest(".row, .constrow, .urow, .routes .r, .walk .step") || container;   // span the whole row, not the middle column
    const card = container.closest(".grid2 > .card");       // two-up cards go full width while code is open
    if (open) { open.remove(); open = null; b.textContent = label; if (card && !card.querySelector(".diff")) card.classList.remove("wide"); return; }
    open = diffTable(hunkIds, opts);
    host.append(open);
    if (card) card.classList.add("wide");
    b.textContent = "hide code";
  });
  return b;
}

function jumpFile(path) {
  if (topicFilter !== "all" && FILES[path] && topicOf(FILES[path]) !== topicFilter) { topicFilter = "all"; render(); }
  const el = document.getElementById("file-" + (FILES[path] || {}).rank);
  if (!el) return;
  rememberSpot();
  reveal(el);
  if (!el._open) el.querySelector(".fh").click();
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function loc(file, line) {
  if (!file) return null;
  return h("span", { class: "locwrap" }, h("span", { class: "loc", title: "Jump to file diff", onclick: () => jumpFile(file) }, `${file}${line ? ":" + line : ""}`), editorLink(file, line, "↗"));
}

// ------------------------------------------------------------------ top bar + rail
function renderTop() {
  const top = document.getElementById("top");
  top.innerHTML = "";
  const sev = { high: 0, medium: 0, low: 0 };
  R.risks.forEach(r => sev[r.severity]++);
  const llm = R.llm || {};
  (llm.concerns || []).forEach(c => sev[c.severity] = (sev[c.severity] || 0) + 1);
  const head = R.head.worktree ? "working tree" : R.head.ref;
  top.append(
    h("div", { class: "brand" }, h("i"), "glance"),
    h("div", { class: "ref", title: `${R.repo_path}` }, h("b", {}, R.repo), "  ", R.base.ref, " … ", h("b", {}, head), R.branch && R.head.worktree ? `  (${R.branch})` : ""),
    h("span", { class: "pill mono" }, h("span", { class: "add" }, "+" + R.stats.additions), h("span", { class: "del" }, "−" + R.stats.deletions), h("span", { style: "color:var(--muted)" }, plural(R.stats.files, "file"))),
    sev.high ? h("span", { class: "pill h" }, sev.high + " high") : null,
    sev.medium ? h("span", { class: "pill m" }, sev.medium + " medium") : null,
    sev.low ? h("span", { class: "pill l" }, sev.low + " low") : null,
    h("div", { class: "spacer" }),
    h("div", { class: "progress", id: "prog" }, h("div", { class: "bar" }, h("span")), h("span", { class: "t" }, "")),
    STATIC ? null : h("button", { class: "btn", id: "refresh", title: "Re-run analysis on the current working tree", onclick: refresh }, "↻ Refresh"),
  );
  updateProgress();
}

const SECTIONS = [
  ["overview", "Overview"], ["story", "Story"], ["risks", "Risks"], ["logic", "Business logic"], ["database", "Database"], ["schemas", "Schemas & types"],
  ["interfaces", "Endpoints & tasks"], ["functions", "Functions"], ["files", "Files"],
];
function sectionCounts() {
  const llm = R.llm || {};
  const ch = R.changes.filter(inTopic);
  const k = kinds => ch.filter(c => kinds.includes(c.kind)).length;
  const blTopic = b => topicOf({ file: HUNKS[(b.hunks || [])[0]]?.file });
  return {
    overview: "",
    story: ((R.story || {}).units || []).filter(inTopic).length,
    risks: riskItems().filter(inTopic).length,
    logic: (llm.business_logic || []).filter(b => topicFilter === "all" || blTopic(b) === topicFilter).length + ch.filter(c => ["config", "agent"].includes(c.kind) && c.status !== "removed").length,
    database: ch.filter(c => c.layer === "database").length,
    schemas: ch.filter(c => c.layer === "schema").length,
    interfaces: k(["route", "task", "env", "dependency"]),
    functions: functionChanges().filter(inTopic).length,
    files: R.files.filter(inTopic).length,
  };
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";

function wordDiff(a, b) {
  const A = (a || "").split(/(\s+)/), B = (b || "").split(/(\s+)/);
  const n = A.length, m = B.length;
  if (n * m > 400000) return esc(b);
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  let i = 0, j = 0, out = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}

function renderFunctions() {
  const fns = functionChanges().filter(inTopic);
  if (!fns.length) return secEl("functions", "Functions", h("div", { class: "empty" }, "No function changes."));
  const ord = { removed: 0, moved: 1, modified: 2, added: 3 };
  fns.sort((a, b) => (b.signature_changed - a.signature_changed) || ord[a.status] - ord[b.status] || a.file.localeCompare(b.file) || a.line - b.line);
  return secEl("functions", "Functions", ...topicGroups("functions", fns, functionRows, c => c.name));
}
function functionRows(fns) {
  const card = h("div", { class: "card" });
  for (const c of fns) {
    const row = h("div", { class: "row" });
    const body = h("div", { class: "body" });
    const tagTxt = c.status === "modified" ? (c.signature_changed ? "signature changed" : "body changed") : c.status;
    body.append(h("div", { class: "title mono" }, c.name, " ", h("span", { class: "st " + (c.signature_changed ? "modified" : c.status) }, tagTxt)));
    if (c.signature_changed && c.before && c.after) body.append(h("div", { class: "sig", style: "padding:6px 0 0;border:0" }, h("span", { class: "was" }, c.before.signature), h("span", { class: "now" }, c.after.signature)));
    else body.append(h("div", { class: "detail mono", style: "color:var(--muted)" }, (c.after || c.before).signature));
    const meta = h("div", { class: "meta" });
    const t = codeToggle(body, c.hunk_ids);
    if (t) meta.append(t);
    if (c.callers && c.callers.length) {
      const outside = c.callers.filter(x => !x.in_diff).length;
      const b = h("button", { class: "toggle" }, `${plural(c.callers.length, "reference")}${outside ? ` (${outside} outside this diff)` : ""}`);
      let open = null;
      b.addEventListener("click", () => {
        if (open) { open.remove(); open = null; return; }
        open = h("div", { class: "callers" }, c.callers.map(x => h("div", { class: x.in_diff ? "" : "out" }, h("b", {}, `${x.file}:${x.line}`), "  ", x.text)));
        body.append(open);
      });
      meta.append(b);
    }
    if (meta.childNodes.length) body.append(meta);
    row.append(check(c.id, row), body, loc(c.file, c.line));
    card.append(row);
  }
  return card;
}

function renderFiles() {
  const files = R.files.filter(inTopic);
  if (!files.length) return secEl("files", "Files — risk-ranked reading order", h("div", { class: "empty" }, "No files."));
  return secEl("files", "Files — risk-ranked reading order", ...topicGroups("files", files, fileCards, f => f.path.split("/").pop()));
}
function fileCards(files) {
  const out = [];
  for (const f of files) {
    const card = h("div", { class: "card fileblock", id: "file-" + f.rank });
    const sev = fileSeverity(f);
    const fh = h("div", { class: "fh" });
    const chk = check("f:" + f.path, card);
    chk.addEventListener("click", e => e.stopPropagation());
    fh.append(chk, h("span", { class: "rk" }, "#" + f.rank),
      h("div", {}, h("div", { class: "path" }, h("span", { class: "dot " + sev, style: "margin-right:8px;vertical-align:1px" }), f.path, h("span", { class: "cat" }, f.category), f.status !== "modified" ? h("span", { class: "cat" }, f.status) : null),
        h("span", { class: "why" }, f.reasons.join(" · "))),
      h("span", { class: "stats" }, h("span", { class: "add" }, "+" + f.additions), " ", h("span", { class: "del" }, "−" + f.deletions)),
      f.status === "removed" ? h("span") : editorLink(f.path, f.hunks[0]?.new_start));
    fh.addEventListener("click", () => {
      if (card._open) { card._open.remove(); card._open = null; return; }
      if (!f.hunks.length) { card._open = h("div", { class: "more" }, f.binary ? "Binary file" : f.category === "lockfile" || f.category === "generated" ? "Diff hidden (" + f.category + ")" : "No textual diff"); }
      else card._open = diffTable(f.hunks.map(x => x.id), { showFile: false });
      card.append(card._open);
    });
    card.append(fh);
    out.push(card);
  }
  return out;
}

// ------------------------------------------------------------------ intent ("what was this supposed to do?")
let intentEditing = false;
async function saveIntent(text) {
  try {
    const r = await fetch("/api/intent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ intent: text }) });
    const j = await r.json();
    intentEditing = false;
    R.intent = text.trim() || null;
    if (j.status === "running") { R.llm = { ...(R.llm || {}), status: "running" }; toast("Checking the change against the task — a few minutes"); render(); poll(); }
    else if (j.status === "cleared") { R.llm = { ...(R.llm || {}), intent: null }; toast("Task cleared"); render(); }
    else { toast("Task saved. AI isn't available, so the check didn't run"); render(); }
  } catch { toast("Couldn't reach the glance server"); }
}
function intentCard() {
  const llm = R.llm || {};
  const it = llm.status === "ok" ? llm.intent : null;
  const card = h("div", { class: "card intentcard" });
  const head = h("div", { class: "asked" }, h("b", {}, "Task"));
  if (intentEditing) {
    const ta = h("textarea", { class: "intent-in", rows: 5, placeholder: "Paste the task, ticket or plan the change was meant to carry out. Glance's AI will check what was done, what's missing, and what was added that nobody asked for." });
    ta.value = R.intent || "";
    card.append(head, h("div", { class: "intent-edit" }, ta,
      h("div", { class: "intent-actions" },
        h("button", { class: "btn ai", onclick: () => saveIntent(ta.value) }, "Check the change against this"),
        h("button", { class: "btn", onclick: () => { intentEditing = false; render(); } }, "Cancel"),
        R.intent ? h("button", { class: "btn", onclick: () => saveIntent("") }, "Remove task") : null)));
    setTimeout(() => ta.focus(), 0);
    return card;
  }
  if (!R.intent) {
    head.append(h("span", { class: "intent-empty" }, "What was this change supposed to do? Give glance the task and it will check the change against it."));
    if (!STATIC) head.append(" ", h("button", { class: "toggle", onclick: () => { intentEditing = true; render(); } }, "Add the task"));
    card.append(head);
    return card;
  }
  head.append(h("span", { class: "intent-text" }, R.intent.length > 400 ? R.intent.slice(0, 400) + "…" : R.intent));
  if (!STATIC) head.append(" ", h("button", { class: "toggle", onclick: () => { intentEditing = true; render(); } }, "edit"));
  card.append(head);
  if (llm.status === "running") card.append(h("div", { class: "llm-state" }, h("span", { class: "spin" }), "Checking the change against this task…"));
  else if (it && ((it.done || []).length || (it.extra || []).length || (it.missing || []).length)) {
    const col = (cls, title, items, render) => h("div", { class: cls }, h("h4", {}, title), items && items.length ? h("ul", {}, items.map(render)) : h("div", { class: "empty" }, "—"));
    card.append(h("div", { class: "intent" },
      col("done", "Done", it.done, d => h("li", {}, d)),
      col("missing", "Missing from the task", it.missing, m => h("li", {}, m)),
      col("extra", "Done but not in the task", it.extra, e => {
        const li = h("li", {}, typeof e === "string" ? e : e.text, " ");
        if (e.hunks && e.hunks.length) li.append(codeToggle(li, e.hunks, "code"));
        return li;
      })));
  } else if (!STATIC) {
    card.append(h("div", { class: "llm-state" }, "Not checked against this task yet. ", h("button", { class: "btn ai", onclick: () => saveIntent(R.intent) }, "Check now")));
  }
  return card;
}

// ------------------------------------------------------------------ story
const STATUS_WORD = { added: "New", modified: "Changed", removed: "Removed" };
function jumpUnit(id) {
  const el = document.getElementById("unit-" + id);
  if (!el) return;
  rememberSpot(); reveal(el);
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}
async function startModelPass() {
  try {
    const r = await fetch("/api/llm", { method: "POST" });
    if (!r.ok) { toast("Couldn't start the AI summary (is the `claude` CLI installed?)"); return; }
    toast("Claude is reading the change — a few minutes");
    R.llm = { status: "running" }; render(); poll();
  } catch { toast("Couldn't reach the glance server"); }
}
function unitRow(u, ai) {
  const row = h("div", { class: "urow", id: "unit-" + u.id });
  const c0 = R.changes.find(c => c.id === u.change_ids[0]);
  const body = h("div", { class: "ubody" },
    h("div", {}, h("span", { class: "nm" }, u.name), " ", h("span", { class: "st " + u.status }, STATUS_WORD[u.status] || u.status), " ",
      h("span", { class: "fw" }, u.kind === "function" && u.chapter === "background" && u.detail.includes("steps") ? "workflow" : u.kind),
      u.used_by_routes ? h("span", { class: "tag-route", title: "Referenced by changed route/controller code" }, " used by routes") : null),
    ai && ai.what ? h("div", { class: "what" }, ai.what) : null,
    ai && ai.why ? h("div", { class: "uwhy" }, ai.why) : null,
    u.detail ? h("div", { class: "det" }, u.detail) : null);
  const meta = h("div", { class: "meta" });
  if (c0 && (c0.field_changes || []).length && ["table", "model", "type"].includes(c0.kind)) {
    let open = null;
    const b = h("button", { class: "toggle" }, "fields");
    b.addEventListener("click", () => {
      if (open) { open.remove(); open = null; b.textContent = "fields"; return; }
      open = h("div", { class: "ftable" }, fieldTable(c0, 40)); row.append(open); b.textContent = "hide fields";
    });
    meta.append(b);
  }
  const t = codeToggle(body, u.hunk_ids);
  if (t) meta.append(t);
  if (meta.childNodes.length) body.append(meta);
  row.append(check(`s:${u.chapter}:${u.name}`, row), body, loc(u.file, u.line) || h("span"));
  return row;
}
function renderStory() {
  const st = R.story;
  if (!st || !(st.units || []).length) return secEl("story", "The change, step by step", h("div", { class: "empty" }, "Nothing to narrate."));
  const llm = R.llm || {};
  const ai = (llm.status === "ok" && llm.story) || {};
  const aiUnits = ai.units || {};
  const units = Object.fromEntries(st.units.map(u => [u.id, u]));
  const out = [];

  // 1. goal
  const goal = h("div", { class: "card goal" });
  goal.append(h("div", { class: "chap-hd", style: "padding:0 0 10px" }, h("span", { class: "num" }, 1), h("div", {}, h("h3", {}, "What this accomplishes")), h("span")));
  if (ai.goal) goal.append(h("div", { class: "lead" }, ai.goal));
  else goal.append(h("div", { class: "lead muted" }, (R.commits && R.commits.length ? R.commits[0].split("\n")[0] : R.summary.headline)));
  if ((ai.how_it_works || []).length) {
    goal.append(h("div", { class: "src", style: "margin-top:16px" }, "How it works"),
      h("ol", { class: "flow" }, ai.how_it_works.map(step => h("li", {}, h("div", {}, step.text, h("div", {},
        step.units.filter(id => units[id]).map(id => h("span", { class: "chip", title: "Jump to " + units[id].name, onclick: () => jumpUnit(id) }, units[id].name))))))));
  }
  const bar = h("div", { class: "aibar" });
  if (llm.status === "running") bar.append(h("span", { class: "spin" }), "Claude is reading the change and writing the walkthrough (usually 2–5 minutes). Everything below is already accurate; explanations fill in when it lands.");
  else if (llm.status !== "ok") {
    if (!STATIC) bar.append(h("button", { class: "btn ai", onclick: startModelPass }, "✨ Generate AI summary"));
    bar.append(llm.status === "error" ? "Last attempt failed: " + (llm.error || "unknown error") : "Adds a plain-English goal, how-it-works steps and a what/why for every item below.");
  }
  if (bar.childNodes.length) goal.append(bar);
  out.push(goal);

  // 2-6. chapters
  let n = 1;
  for (const ch of st.chapters) {
    if (ch.id === "goal") continue;
    const us = ch.unit_ids.map(id => units[id]).filter(u => u && inTopic(u));
    if (!us.length) continue;
    n++;
    const counts = ["added", "modified", "removed"].map(s => [s, us.filter(u => u.status === s).length]).filter(([, k]) => k);
    const card = h("div", { class: "card chap", id: "chap-" + ch.id });
    card.append(h("div", { class: "chap-hd" }, h("span", { class: "num" }, n),
      h("div", {}, h("h3", {}, ch.title), h("div", { class: "intro" }, (ai.chapters || {})[ch.id] || ch.blurb)),
      h("span", { class: "cnts" }, counts.map(([s, k]) => `${k} ${STATUS_WORD[s].toLowerCase()}`).join(" · "))));
    const list = sub => {
      const kids = [];
      for (const s of ["added", "modified", "removed"]) {
        const g = sub.filter(u => u.status === s);
        if (!g.length) continue;
        kids.push(h("div", { class: "st-h " + s }, `${STATUS_WORD[s]} · ${g.length}`), ...g.map(u => unitRow(u, aiUnits[u.id])));
      }
      return kids;
    };
    if (ch.id === "supporting" && us.length > 8) card.append(...topicGroups("story-supporting", us, list, u => u.name));
    else card.append(...list(us));
    out.push(card);
  }
  if ((st.test_files || []).length) out.push(h("div", { class: "more", style: "border:0;padding:10px 4px" }, `Plus ${plural(st.test_files.length, "test file")} — see Files.`));
  return secEl("story", "The change, step by step", ...out);
}

// ------------------------------------------------------------------ boot
function indexReport() {
  HUNKS = {}; FILES = {};
  for (const f of R.files) { FILES[f.path] = f; for (const hk of f.hunks) HUNKS[hk.id] = { file: f.path, hunk: hk }; }
}

function render() {
  indexReport();
  loadReviewed();
  document.title = `glance · ${R.repo}`;
  renderTop();
  renderRail();
  const main = document.getElementById("main");
  const y = window.scrollY;
  main.innerHTML = "";
  if (R.errors && R.errors.length) main.append(h("div", { class: "card", style: "padding:10px 16px;margin-bottom:16px;color:var(--high);font-size:13px" }, R.errors.join("\n")));
  main.append(renderOverview(), renderStory(), renderRisks(), renderLogic(), renderLayer("database"), renderLayer("schemas"), renderInterfaces(), renderFunctions(), renderFiles());
  updateBack();
  syncGroups();
  window.scrollTo(0, y);
  updateProgress();
  observeSections();
}

let obs;
function observeSections() {
  if (obs) obs.disconnect();
  obs = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting) {
      document.querySelectorAll(".rail a.sec").forEach(a => a.classList.toggle("on", a.dataset.sec === e.target.id));
    }
  }, { rootMargin: "-80px 0px -70% 0px" });
  document.querySelectorAll("section.sec").forEach(s => obs.observe(s));
}

async function fetchReport() {
  const r = await fetch("/api/report", { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

let polling = false;
async function poll(untilChangedFrom) {
  if (polling) return;
  polling = true;
  try {
    for (let i = 0; i < 400; i++) {
      await new Promise(res => setTimeout(res, 2500));
      const next = await fetchReport();
      const llmChanged = (next.llm || {}).status !== (R.llm || {}).status;
      const idChanged = untilChangedFrom && next.id !== untilChangedFrom;
      if (idChanged || llmChanged || (next._rebuilding === false && untilChangedFrom && next.id !== R.id)) {
        R = next; render();
        if (idChanged) toast("Report refreshed");
        if ((R.llm || {}).status === "ok" && llmChanged) toast("Model pass finished");
      }
      if ((R.llm || {}).status !== "running" && !next._rebuilding && (!untilChangedFrom || next.id !== untilChangedFrom)) break;
    }
  } catch (e) { console.warn(e); }
  polling = false;
}

async function refresh() {
  const b = document.getElementById("refresh");
  if (b) { b.disabled = true; b.textContent = "Refreshing…"; }
  const before = R.id;
  try { await fetch("/api/refresh", { method: "POST" }); } catch {}
  await poll(before);
  const b2 = document.getElementById("refresh");
  if (b2) { b2.disabled = false; b2.textContent = "↻ Refresh"; }
}

async function boot() {
  try {
    R = STATIC ? window.__GLANCE_REPORT__ : await fetchReport();
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="err">Couldn't load report: ${esc(e.message)}</div>`;
    return;
  }
  render();
  if (!STATIC && (R.llm || {}).status === "running") poll();
}
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || e.target.isContentEditable || e.metaKey || e.ctrlKey) return;
  if (e.key === "r" && !STATIC) refresh();
  if (e.key === "Backspace" && backStack.length) { e.preventDefault(); goBack(); }
});
document.getElementById("backbtn").addEventListener("click", goBack);
boot();
})();
</script>
