[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glance-review"
version = "0.1.0"
description = "Structured local code review for AI-written changes: schemas, models, routes, business logic and risks at a glance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
glance = "glance.cli:main"

[tool.setuptools.packages.find]
include = ["glance*"]

[tool.setuptools.package-data]
glance = ["ui/*"]
